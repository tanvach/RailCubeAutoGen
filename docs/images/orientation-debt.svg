<text x="20" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">Orientation debt: fewest pieces to realign (dir, up)</text><text x="20" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">From orientationLowerBound. Sketch axes: +x →, +y ↑, +z ↘. Cost 1 uses curveLeft’s exit frame.</text><rect x="16" y="62" width="250" height="242" rx="10" fill="#fff" stroke="#e5e7eb"/><text x="30" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">Cost 0 — start frame</text><text x="30" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Already home.</text><text x="30" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">No pieces needed to realign.</text><polygon points="107,199 167,199 186.28571428571428,216.14285714285714 126.28571428571428,216.14285714285714" fill="#e5e7eb" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="126.28571428571428,216.14285714285714 186.28571428571428,216.14285714285714 186.28571428571428,180.14285714285714 126.28571428571428,180.14285714285714" fill="#dbe3ee" fill-opacity="0.85" stroke="#4b5563" stroke-width="1.2"/><polygon points="107,199 167,199 167,163 107,163" fill="#f3f4f6" fill-opacity="0.95" stroke="#4b5563" stroke-width="1.2"/><polygon points="167,199 186.28571428571428,216.14285714285714 186.28571428571428,180.14285714285714 167,163" fill="#d1d5db" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="107,163 167,163 186.28571428571428,180.14285714285714 126.28571428571428,180.14285714285714" fill="#93c5fd" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><line x1="141" y1="192" x2="167.5" y2="192" stroke="#2563eb" stroke-wid