<text x="20" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">Orientation debt: fewest pieces to realign (dir, up)</text><text x="20" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Costs from the BFS word metric on the cube rotation group (orientationLowerBound).</text><rect x="16" y="62" width="250" height="228" rx="10" fill="#fff" stroke="#e5e7eb"/><text x="30" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">Cost 0 — start frame</text><text x="30" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Already home.</text><text x="30" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">No pieces needed to realign.</text><polygon points="107,191 167,191 185,207 125,207" fill="#e5e7eb" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="107,191 167,191 167,155 107,155" fill="#f3f4f6" fill-opacity="0.95" stroke="#4b5563" stroke-width="1.2"/><polygon points="167,191 185,207 185,171 167,155" fill="#d1d5db" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="107,155 167,155 185,171 125,171" fill="#93c5fd" fill-opacity="0.85" stroke="#4b5563" stroke-width="1.2"/><line x1="143" y1="184" x2="171" y2="184" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><polygon points="179,184 171,188.5 171,179.5" fill="#2563eb"/><text x="189" y="193.4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2563eb" font-weight="600" text-anchor="start">dir</text><line x1="143" y1="184" x2="143" y2="156" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/><polygon points="143,148 147.5,156 138.5,156" fill="#059669"/><text x="148.4" y="142" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="start">up</text><text x="30" y="274" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">orientationLowerBound = 0</text><rect x="278" y="62" width="250" height="228" rx="10" fill="#fff" stroke="#e5e7eb"/><text x="292" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">Cost 1 — one yaw away</text><text x="292" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">One curve (yaw) restores</text><text x="292" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">the start orientation.</text><polygon points="369,191 429,191 447,207 387,207" fill="#e5e7eb" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="369,191 429,191 429,155 369,155" fill="#f3f4f6" fill-opacity="0.95" stroke="#4b5563" stroke-width="1.2"/><polygon points="429,191 447,207 447,171 429,155" fill="#d1d5db" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="369,155 429,155 447,171 387,171" fill="#93c5fd" fill-opacity="0.85" stroke="#4b5563" stroke-width="1.2"/><line x1="405" y1="184" x2="397.7" y2="204.5" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><polygon points="395,212 393.5,203 401.9,206" fill="#2563eb"/><text x="386.5512297074063" y="223.60120257215834" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2563eb" font-weight="600" text-anchor="start">dir</text><line x1="405" y1="184" x2="405" y2="156" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/><polygon points="405,148 409.5,156 400.5,156" fill="#059669"/><text x="410.4" y="142" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="start">up</text><text x="292" y="274" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#1f2937" font-weight="700" text-anchor="start">orientationLowerBound = 1</text><rect x="540" y="62" width="250" height="228" rx="10" fill="#fff" stroke="#e5e7eb"/><text x="554" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">Cost 4 — ceiling hang</text><text x="554" y="106" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">dir correct, up inverted.</text><text x="554" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Needs a roll; no piece rolls.</text><polygon points="631,191 691,191 709,207 649,207" fill="#e5e7eb" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="631,191 691,191 691,155 631,155" fill="#f3f4f6" fill-opacity="0.95" stroke="#4b5563" stroke-width="1.2"/><polygon points="691,191 709,207 709,171 691,155" fill="#d1d5db" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="631,191 691,191 709,207 649,207" fill="#93c5fd" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><line x1="667" y1="184" x2="695" y2="184" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><polygon points="703,184 695,188.5 695,179.5" fill="#2563eb"/><text x="713" y="193.4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2563eb" font-weight="600" text-anchor="start">dir</text><line x1="667" y1="184" x2="667" y2="212" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/><polygon points="667,220 662.5,212 671.5,212" fill="#059669"/><text x="661.6" y="234" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="start">up</text><text x="554" y="274" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="700" text-anchor="start">orientationLowerBound = 4</text>
