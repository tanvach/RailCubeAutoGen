<text x="20" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">Solids never overlap; swing cells may be shared</text><text x="20" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Amber dashed = swing (clearance). Colored fill = solid. Geometry from computePlacement.</text><rect x="16" y="62" width="260" height="230" rx="10" fill="#fff" stroke="#e5e7eb"/><text x="30" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1f2937" font-weight="600" text-anchor="start">Straight</text><text x="30" y="104" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">1 solid + 1 swing above</text><rect x="66" y="134" width="44" height="44" fill="none" stroke="#e5e7eb"/><rect x="66" y="90" width="44" height="44" fill="none" stroke="#e5e7eb"/><rect x="110" y="134" width="44" height="44" fill="none" stroke="#e5e7eb"/><rect x="67.5" y="91.5" width="41" height="41" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="67.5" y="135.5" width="41" height="41" rx="3" fill="#facc15" stroke="#4b5563" stroke-width="1.5"/><circle cx="88" cy="156" r="3.5" fill="#111827"/><circle cx="132" cy="156" r="3.5" fill="#7c3aed"/><line x1="88" y1="156" x2="132" y2="156" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/><line x1="88" y1="156" x2="100.9" y2="156" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><polygon points="108.9,156 100.9,160.5 100.9,151.5" fill="#2563eb"/><text x="118.9" y="165.4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2563eb" font-weight="600" text-anchor="start">dir</text><line x1="88" y1="156" x2="88" y2="143.1" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/><polygon points="88,135.1 92.5,143.1 83.5,143.1" fill="#059669"/><tex