<text x="24" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">Same cell, same heading — three different frames</text><text x="24" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">dir is travel; up is the rail-face normal (toward the train). right = dir × up.</text><rect x="24" y="70" width="184" height="210" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><text x="38" y="94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">Floor</text><text x="38" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">rail on top</text><polygon points="84,193.4 140,193.4 158,209.4 102,209.4" fill="#e5e7eb" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="84,193.4 140,193.4 140,159.8 84,159.8" fill="#f3f4f6" fill-opacity="0.95" stroke="#4b5563" stroke-width="1.2"/><polygon points="140,193.4 158,209.4 158,175.8 140,159.8" fill="#d1d5db" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="84,159.8 140,159.8 158,175.8 102,175.8" fill="#93c5fd" fill-opacity="0.85" stroke="#4b5563" stroke-width="1.2"/><line x1="118" y1="187" x2="144" y2="187" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><polygon points="152,187 144,191.5 144,182.5" fill="#2563eb"/><text x="162" y="196.4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2563eb" font-weight="600" text-anchor="start">dir</text><line x1="118" y1="187" x2="118" y2="161" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/><polygon points="118,153 122.5,161 113.5,161" fill="#059669"/><text x="123.4" y="147" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="start">up</text><text x="38" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">up = (0, 1, 0)</text><rect x="224" y="70" width="184" height="210" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><text x="238" y="94" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">Wall</text><text x="238" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">rail on +z face</text><polygon points="284,193.4 340,193.4 358,209.4 302,209.4" fill="#e5e7eb" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="284,193.4 340,193.4 340,159.8 284,159.8" fill="#f3f4f6" fill-opacity="0.95" stroke="#4b5563" stroke-width="1.2"/><polygon points="340,193.4 358,209.4 358,175.8 340,159.8" fill="#d1d5db" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><polygon points="340,193.4 358,209.4 358,175.8 340,159.8" fill="#93c5fd" fill-opacity="0.9" stroke="#4b5563" stroke-width="1.2"/><line x1="318" y1="187" x2="344" y2="187" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><polygon points="352,187 344,191.5 344,182.5" fill="#2563eb"/><text x="362" y="196.4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#2563eb" font-weight="600" text-anchor="start">dir</text><line x1="318" y1="187" x2="334.1" y2="201.6" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/><polygon points="340,207 331.1,204.9 337.1,198.3" fill="#059669"/><text x="343.7669676463794" y="221.72240433630122" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="start">up</text><text x="238" y="266" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">up = (0, 0, 1)</text><rect x="424" y="70" width="184" height="210" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1"/><